<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c3e50"/>
      <stop offset="1" stop-color="#16212c"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ccd4d8"/>
    </linearGradient>
  </defs>

  <!-- Badge-Hintergrund -->
  <rect x="3" y="3" width="94" height="94" rx="21" fill="url(#badgeGrad)"/>

  <!-- Abkantprozess: Stempel (oben) biegt Blech (V) über dem Gesenk (unten) -->

  <!-- Blech (V-förmig um den Stempel gelegt) -->
  <path d="M 14 42 L 50 61 L 86 42" fill="none" stroke="#66757f" stroke-width="9.5"
        stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 14 42 L 50 61 L 86 42" fill="none" stroke="url(#metalGrad)" stroke-width="6.5"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Gesenk (unteres Werkzeug) -->
  <rect x="30" y="68" width="40" height="13" rx="2" fill="url(#metalGrad)" stroke="#66757f" stroke-width="2.2"/>
  <path d="M 44 68 L 50 76 L 56 68" fill="none" stroke="#66757f" stroke-width="2.2" stroke-linejoin="round"/>
  <rect x="45" y="81" width="10" height="10" fill="url(#metalGrad)" stroke="#66757f" stroke-width="2.2"/>

  <!-- Stempel (oberes Werkzeug) -->
  <path d="M 43 28 L 57 28 L 50 60 Z" fill="url(#metalGrad)" stroke="#66757f" stroke-width="2.2" stroke-linejoin="round"/>
  <rect x="45.5" y="12" width="9" height="18" fill="url(#metalGrad)" stroke="#66757f" stroke-width="2.2"/>
  <circle cx="50" cy="10" r="4.5" fill="url(#metalGrad)" stroke="#66757f" stroke-width="2.2"/>

  <!-- Biegepunkt -->
  <circle cx="50" cy="61" r="5" fill="#f39c12" stroke="#c9790a" stroke-width="1.2"/>
</svg>
